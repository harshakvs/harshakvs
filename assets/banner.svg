<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Sreeharsha Kotta — ML engineer: production VLMs, vLLM serving, real-time video AI">
  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .l { animation: in .5s ease backwards; }
    .l1 { animation-delay: .2s } .l2 { animation-delay: .9s } .l3 { animation-delay: 1.6s } .l4 { animation-delay: 2.3s }
    .cur { animation: blink 1s steps(1) infinite; }
    .node { animation: pulse 3s ease-in-out infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }
    @keyframes blink { 50% { opacity: 0 } }
    @keyframes pulse { 50% { opacity: .25 } }
    @media (prefers-reduced-motion: reduce) { .l, .cur, .node { animation: none } }
  </style>
  <rect width="1200" height="300" rx="16" fill="#0b111b"/>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="15.5" fill="none" stroke="#1e2c40" stroke-width="1.5"/>

  <!-- neural net motif -->
  <g stroke="#4ef0c3" stroke-opacity=".14" stroke-width="1.2">
    <line x1="880" y1="70" x2="980" y2="120"/><line x1="880" y1="70" x2="980" y2="200"/>
    <line x1="880" y1="150" x2="980" y2="120"/><line x1="880" y1="150" x2="980" y2="200"/>
    <line x1="880" y1="230" x2="980" y2="120"/><line x1="880" y1="230" x2="980" y2="200"/>
    <line x1="980" y1="120" x2="1080" y2="100"/><line x1="980" y1="120" x2="1080" y2="180"/>
    <line x1="980" y1="200" x2="1080" y2="100"/><line x1="980" y1="200" x2="1080" y2="180"/>
    <line x1="1080" y1="100" x2="1140" y2="140"/><line x1="1080" y1="180" x2="1140" y2="140"/>
  </g>
  <g fill="#4ef0c3">
    <circle class="node" cx="880" cy="70" r="5"/><circle class="node" cx="880" cy="150" r="5" style="animation-delay:.6s"/><circle class="node" cx="880" cy="230" r="5" style="animation-delay:1.2s"/>
    <circle class="node" cx="980" cy="120" r="5" style="animation-delay:.3s"/><circle class="node" cx="980" cy="200" r="5" style="animation-delay:.9s"/>
    <circle class="node" cx="1080" cy="100" r="5" style="animation-delay:1.5s"/><circle class="node" cx="1080" cy="180" r="5" style="animation-delay:.45s"/>
  </g>
  <circle cx="1140" cy="140" r="7" fill="#7cc4ff"/>

  <!-- terminal -->
  <circle cx="44" cy="40" r="6" fill="#ff5f57"/><circle cx="64" cy="40" r="6" fill="#febc2e"/><circle cx="84" cy="40" r="6" fill="#28c840"/>
  <text x="108" y="45" class="mono" font-size="14" fill="#5b6b82">sreeharsha@github: ~</text>

  <text x="44" y="100" class="mono l l1" font-size="22" fill="#e6edf3"><tspan fill="#4ef0c3">$</tspan> whoami</text>
  <text x="44" y="146" class="sans l l2" font-size="40" font-weight="700" fill="#e6edf3">Sreeharsha <tspan fill="#4ef0c3">Kotta</tspan></text>
  <text x="44" y="190" class="mono l l3" font-size="18" fill="#9aa8bb">ML engineer · production VLMs · vLLM serving · real-time video AI</text>
  <text x="44" y="240" class="mono l l4" font-size="17" fill="#7cc4ff">600+ cameras  ·  95% precision / 92% recall  ·  alerts in 4–5s<tspan class="cur" fill="#4ef0c3"> █</tspan></text>
</svg>
