<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Real-time safety pipeline: cameras feed an edge fall route (YOLO-Pose, frame grid, Qwen-VL FP16, alert under 2s) and a cloud route (edge anomaly model, queue of 3s snippets, fast check and detailed analysis with Qwen-VL on vLLM, alert in 5-6s), traced in Langfuse">
  <style>
    .t { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; font-size: 15px; font-weight: 600; }
    .s { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #9aa8bb; font-size: 12px; }
    .lane { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 1px; }
    .box { fill: #111a27; stroke: #26384f; stroke-width: 1.5; }
    .vlm { fill: #0f2a26; stroke: #4ef0c3; stroke-width: 1.5; }
    .alert { fill: #2a1416; stroke: #ff6b6b; stroke-width: 1.5; }
    .a { stroke: #5b6b82; stroke-width: 1.8; fill: none; marker-end: url(#h); }
    .d { stroke: #7cc4ff; stroke-width: 1.4; fill: none; stroke-dasharray: 5 5; marker-end: url(#hb); }
    .lbl { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; fill: #7f8ea3; }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b82"/></marker>
    <marker id="hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7cc4ff"/></marker>
  </defs>
  <rect width="1200" height="470" rx="16" fill="#0b111b"/>
  <rect x="0.75" y="0.75" width="1198.5" height="468.5" rx="15.5" fill="none" stroke="#1e2c40" stroke-width="1.5"/>

  <!-- lane labels -->
  <text x="190" y="40" class="lane" fill="#4ef0c3">EDGE · FALL ROUTE</text>
  <text x="190" y="214" class="lane" fill="#7cc4ff">EDGE → CLOUD · ANOMALY ROUTE</text>
  <text x="580" y="214" class="lane" fill="#4ef0c3">vLLM · BATCHED ACROSS CAMERAS · 4 GPUs</text>

  <!-- cameras -->
  <rect x="24" y="56" width="136" height="252" rx="12" class="box"/>
  <text x="92" y="170" class="t" text-anchor="middle">600+</text>
  <text x="92" y="192" class="t" text-anchor="middle">cameras</text>
  <text x="92" y="216" class="s" text-anchor="middle">100+ edge</text>
  <text x="92" y="232" class="s" text-anchor="middle">devices</text>

  <!-- top lane -->
  <rect x="190" y="56" width="180" height="76" rx="10" class="box"/>
  <text x="280" y="88" class="t" text-anchor="middle">YOLO-Pose</text>
  <text x="280" y="110" class="s" text-anchor="middle">edge GPU · FP16</text>

  <rect x="400" y="56" width="180" height="76" rx="10" class="box"/>
  <text x="490" y="88" class="t" text-anchor="middle">6 frames → 1 grid</text>
  <text x="490" y="110" class="s" text-anchor="middle">time, as one image</text>

  <rect x="610" y="56" width="180" height="76" rx="10" class="vlm"/>
  <text x="700" y="88" class="t" text-anchor="middle">Qwen-VL (edge)</text>
  <text x="700" y="110" class="s" text-anchor="middle">FP16 · fall / normal</text>

  <rect x="1000" y="56" width="176" height="76" rx="10" class="alert"/>
  <text x="1088" y="88" class="t" text-anchor="middle">Fall alert</text>
  <text x="1088" y="110" class="s" text-anchor="middle">under 2s</text>

  <path d="M160 94 H186" class="a"/>
  <path d="M370 94 H396" class="a"/>
  <path d="M580 94 H606" class="a"/>
  <path d="M790 94 H996" class="a"/>
  <text x="893" y="84" class="lbl" text-anchor="middle">fall probability</text>

  <!-- bottom lane -->
  <rect x="190" y="232" width="150" height="76" rx="10" class="box"/>
  <text x="265" y="264" class="t" text-anchor="middle">Anomaly model</text>
  <text x="265" y="286" class="s" text-anchor="middle">on edge</text>

  <rect x="370" y="232" width="180" height="76" rx="10" class="box"/>
  <text x="460" y="264" class="t" text-anchor="middle">Cloud queue</text>
  <text x="460" y="286" class="s" text-anchor="middle">10s clip → 3s snippets</text>

  <rect x="580" y="232" width="180" height="76" rx="10" class="vlm"/>
  <text x="670" y="264" class="t" text-anchor="middle">Fast check</text>
  <text x="670" y="286" class="s" text-anchor="middle">Qwen-VL on vLLM</text>

  <rect x="790" y="232" width="180" height="76" rx="10" class="vlm"/>
  <text x="880" y="264" class="t" text-anchor="middle">Detailed analysis</text>
  <text x="880" y="286" class="s" text-anchor="middle">flags + description</text>

  <rect x="1000" y="232" width="176" height="76" rx="10" class="alert"/>
  <text x="1088" y="264" class="t" text-anchor="middle">Alert to staff</text>
  <text x="1088" y="286" class="s" text-anchor="middle">record → alert 5–6s</text>

  <path d="M160 270 H186" class="a"/>
  <path d="M340 270 H366" class="a"/>
  <path d="M550 270 H576" class="a"/>
  <path d="M760 270 H786" class="a"/>
  <path d="M970 270 H996" class="a"/>

  <!-- vLLM band + Langfuse -->
  <rect x="580" y="378" width="390" height="56" rx="10" class="box" stroke="#7cc4ff" stroke-dasharray="4 4"/>
  <text x="775" y="404" class="t" text-anchor="middle">Langfuse</text>
  <text x="775" y="423" class="s" text-anchor="middle">latency · tokens · prompts · outputs</text>
  <path d="M670 308 V374" class="d"/>
  <path d="M880 308 V374" class="d"/>

  <!-- legend -->
  <rect x="24" y="392" width="14" height="14" rx="3" class="vlm"/><text x="46" y="404" class="s">VLM inference</text>
  <rect x="24" y="416" width="14" height="14" rx="3" class="alert"/><text x="46" y="428" class="s">alert</text>
</svg>
